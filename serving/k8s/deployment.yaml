apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender-api
  labels: { app: recommender }
spec:
  replicas: 3
  selector: { matchLabels: { app: recommender } }
  template:
    metadata:
      labels: { app: recommender }
    spec:
      containers:
        - name: api
          image: recommender:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - { name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000" }
            - { name: REDIS_HOST, value: "redis" }
            - { name: MODEL_URI, value: "models:/als_recommender/Production" }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "4Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: recommender-svc }
spec:
  selector: { app: recommender }
  ports: [{ port: 80, targetPort: 8000 }]
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: recommender-hpa }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recommender-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
